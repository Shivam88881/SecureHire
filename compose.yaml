services:
  # PostgreSQL Database for UserService
  postgres-userdb:
    image: postgres:15-alpine
    container_name: securehire-userdb
    environment:
      POSTGRES_DB: securehire_userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-userdb-data:/var/lib/postgresql/data
    networks:
      - securehire-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (Optional - Web UI for PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: securehire-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@securehire.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - securehire-network
    depends_on:
      - postgres-userdb

volumes:
  postgres-userdb-data:
    driver: local

networks:
  securehire-network:
    driver: bridge

