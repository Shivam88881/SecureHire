spring:
  application:
    name: userservice

  # PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/securehire_userdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # Use 'validate' with Flyway/Liquibase, or 'update' for development
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          lob:
            non_contextual_creation: true  # Required for PostgreSQL TEXT columns

  # Flyway Database Migration (Optional - recommended for production)
  # flyway:
  #   enabled: true
  #   baseline-on-migrate: true
  #   locations: classpath:db/migration

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    com.stackwise.userservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

